title: "Обсудить"
body:
  - type: markdown
    attributes:
      value: "Общий раздел для вопросов и тем, которые пока не подходят под отдельную категорию."
  - type: textarea
    id: topic
    attributes:
      label: О чём хочешь поговорить?
